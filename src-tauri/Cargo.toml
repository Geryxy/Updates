[package]
name = "kod-koronaja-launcher"
version = "1.0.0"
description = "Köd Koronája – A birodalmak felemelkedése"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kod_koronaja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
